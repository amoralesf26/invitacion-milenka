<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Para Mili</title>
<style>
:root{color-scheme:light;--ink:#10182d;--night:#542d40;--glow:#805466;--paper:#f5ebdd;--gold:#c9aa72;--gold-ink:#664b22;--muted:#59544f;--line:#d6c6b1;font-family:system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 49% 8%,var(--glow),transparent 58%),var(--night);color:var(--ink);padding:clamp(1rem,5vw,3rem) 1rem 4rem}
.layout{max-width:48rem;margin:auto}
header{text-align:center;color:var(--paper);margin-bottom:1.7rem}
.seal{margin:0 auto 1rem;width:3rem;height:3rem;display:grid;place-items:center;color:var(--gold);border:1px solid #c9aa7288;border-radius:50%;font:1.5rem Georgia,serif;box-shadow:0 0 0 .25rem #c9aa7218}
header p{margin:0;font:1rem Georgia,serif;letter-spacing:.24em}
.progress[hidden]{display:none}
.progress{display:flex;justify-content:center;gap:.55rem;margin-top:.9rem}
.progress i{width:1.7rem;height:2px;background:#f5ebdd55}
.progress .active{background:var(--paper)}
main{background:var(--paper);padding:clamp(1.25rem,6vw,4rem);border-radius:.3rem;box-shadow:0 1.8rem 5rem #2d1823aa;border:1px solid #ebdbc3;border-top:3px solid #cfbea4}
.kicker{font-size:.85rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 .75rem}
h1,h2{font-family:Georgia,'Times New Roman',serif;font-weight:400;line-height:1.1;margin:0 0 1.2rem;text-wrap:balance}
h1{font-size:clamp(2.1rem,7vw,3.6rem)}h2{font-size:clamp(1.55rem,5vw,2.35rem)}
p{font-size:1rem;line-height:1.68;margin:0 0 1rem;white-space:pre-line}
p strong{font-weight:700}
.block{margin-top:1.75rem;padding-top:1.55rem;border-top:1px solid var(--line)}
.block h2:focus,h1:focus{outline:none}
blockquote{margin:0 0 1.5rem;padding:.9rem 1rem;background:#fffbf47a;border-left:2px solid #8c7e6e}
blockquote p{font-family:Georgia,serif;font-size:1.12rem;margin-bottom:0}
.ornament{height:1px;background:var(--line);margin:1.15rem 0 1.75rem;width:4rem}
button,input,select,a.action{font:inherit}
button,a.action{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--night);border-radius:3px;background:var(--night);color:#fff5e7;font-size:.86rem;font-weight:650;letter-spacing:.07em;padding:.75rem 1.1rem;min-height:2.8rem;cursor:pointer;text-decoration:none}
button:hover,a.action:hover{background:#6a4053}button:disabled{opacity:.55;cursor:default}
.secondary{background:transparent;color:var(--ink)}.secondary:hover{background:#e8dcca;color:var(--ink)}
:focus-visible{outline:2px solid #886629;outline-offset:3px}
.hint{border:1px solid var(--gold);color:var(--gold-ink);padding:.7rem .9rem;border-radius:2px;background:#fff6e8;margin-bottom:.7rem}
label{display:block;font-size:.94rem}
input:not([type=radio]),select{display:block;width:100%;min-height:2.8rem;margin-top:.4rem;padding:.6rem .7rem;border:1px solid #8b8174;border-radius:3px;background:#fffaf3;color:var(--ink)}
.input-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.6rem;margin-bottom:1rem}
.input-row input{text-align:center}
.choice{display:flex;align-items:center;gap:.7rem;background:#fffbf5;border:1px solid #a99a86;border-radius:3px;margin:.55rem 0;padding:.8rem;line-height:1.45;cursor:pointer}
.choice:has(:checked){background:#eedbe1;border-color:var(--night)}
.choice input{margin:0;accent-color:var(--night)}
form button{margin-top:1rem}
.feedback{font-weight:650;color:#74282b;margin:.8rem 0 0}
.feedback:empty{display:none}
.success{color:#28533d}
.actions{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1.2rem}
.small{font-size:.88rem;color:var(--muted)}
.enter{animation:arrive .45s ease both}
@keyframes arrive{from{opacity:0;transform:translateY(.45rem)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;scroll-behavior:auto!important}}
</style>
</head>

  <header>
    <div class="seal" aria-hidden="true">✧</div>

const page = document.querySelector("#page");
const progress = document.querySelector("#progress");
const masthead = document.querySelector("header p");
const parameters = new URLSearchParams(location.hash.slice(1));
const formId = parameters.get("form") || "";
const phone = parameters.get("wa") || "";
const emailEnabled = /^[a-z0-9]{5,24}$/i.test(formId);
const whatsappEnabled = /^[1-9][0-9]{6,14}$/.test(phone);
const storageKey = "para-mili:" + encrypted.slice(0, 24);
const choices = [];
let copy;

function element(tag, value = "", className = "") {
  const node = document.createElement(tag);
  node.textContent = value;
  if (className) node.className = className;
  return node;
}

function action(label, handler) {
  const button = element("button", label);
  button.type = "button";
  button.addEventListener("click", handler);
  return button;
}

function submitButton(label) {
  const button = element("button", label);
  button.type = "submit";
  return button;
}

function heading(container, level, title) {
  const node = element(level, title);
  node.tabIndex = -1;
  container.append(node);
  return node;
}

function paragraph(text) {
  const paragraph = element("p", text);
  const emphasis = ["ES UNA LOCURA", "ME GUSTARÍA", "domingo 29 de noviembre"].find(word => text.includes(word));
  if (emphasis) {
    const index = text.indexOf(emphasis);
    paragraph.replaceChildren(text.slice(0, index), element("strong", emphasis), text.slice(index + emphasis.length));
  }
  return paragraph;
}

function focusSection(node) {
  node.focus();
  node.scrollIntoView({ block: "start" });
}

function startScreen(title, step, caption) {
  masthead.hidden = step === 0;
  progress.hidden = false;
  progress.replaceChildren(...Array.from({ length: 4 }, (_, index) => element("i", "", index === step ? "active" : "")));
  progress.setAttribute("aria-label", caption || "Introducción");
  page.replaceChildren();
  page.classList.remove("enter");
  requestAnimationFrame(() => page.classList.add("enter"));
  if (caption) page.append(element("p", caption, "kicker"));
  const titleNode = heading(page, "h1", title);
  page.append(element("div", "", "ornament"));
  return titleNode;
}

function section() {
  const block = element("section", "", "block enter");
  page.append(block);
  return block;
}

function status() {
  const message = element("p", "", "feedback");
  message.setAttribute("role", "status");
  return message;
}

function showIntro() {
  startScreen(copy.title, 0, "Introducción");
  page.append(...copy.intro.map(paragraph));
  const next = action("CONTINUAR", () => {
    next.remove();
    showPuzzle(0);
  });
  page.append(next);
}

function showLetter(index) {
  const letter = copy.letters[index];
  const title = startScreen(letter.title, index + 1, "Carta " + (index + 1) + " de 3");
  if (letter.poem) {
    const poem = element("blockquote");
    poem.append(element("p", letter.poemHeading, "kicker"), paragraph(letter.poem));
    page.append(poem);
  }
  page.append(...letter.body.map(paragraph));
  if (index === 0) {
    const next = action("CONTINUAR", () => {
      next.remove();
      showQuestion(index);
    });
    page.append(next);
  } else {
    showQuestion(index, false);
  }
  focusSection(title);
}

function showQuestion(index, moveFocus = true) {
  const block = section();
  const letter = copy.letters[index];
  const title = heading(block, "h2", letter.question);
  const form = element("form");
  for (const [position, labelText] of letter.choices.entries()) {
    const label = element("label", "", "choice");
    const input = element("input");
    input.type = "radio";
    input.name = "choice";
    input.value = String(position);
    input.required = true;
    label.append(input, document.createTextNode(labelText));
    form.append(label);
  }
  form.append(submitButton(index === 0 ? "CONTINUAR" : "SIGUIENTE"));
  form.addEventListener("submit", event => {
    event.preventDefault();
    const selected = new FormData(form).get("choice");
    if (selected === null) return;
    choices[index] = letter.choices[Number(selected)];
    form.remove();
    block.append(element("p", choices[index], "small"));
    if (index === 2) showFinal();
    else showPuzzle(index + 1);
  });
  block.append(form);
  if (moveFocus) focusSection(title);
}

function labelledInput(labelText, name) {
  const label = element("label", labelText);
  const input = element("input");
  input.name = name;
  input.required = true;
  label.append(input);
  return { label, input };
}

function populate(select, options) {
  select.replaceChildren(new Option("Elegir", ""), ...options.map(([label, value]) => new Option(label, value)));
}

function dateInput() {
  const row = element("div", "", "input-row");
  const months = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
  const fields = ["Día", "Mes", "Año"].map(name => {
    const label = element("label", name);
    const select = element("select");
    select.required = true;
    label.append(select);
    row.append(label);
    return select;
  });
  const [day, month, year] = fields;
  populate(month, months.map((name, index) => [name, String(index + 1)]));
  populate(year, Array.from({ length: 17 }, (_, index) => [2030 - index, 2030 - index]));
  const updateDays = () => {
    const selected = day.value;
    const count = month.value ? new Date(Number(year.value || 2024), Number(month.value), 0).getDate() : 31;
    populate(day, Array.from({ length: count }, (_, index) => [index + 1, index + 1]));
    day.value = Number(selected) <= count ? selected : "";
  };
  month.addEventListener("change", updateDays);
  year.addEventListener("change", updateDays);
  updateDays();
  return { node: row, value: () => fields.map(field => field.value).join("/") };
}

function codeInput() {
  const row = element("div", "", "input-row");
  const inputs = [1, 2, 3].map(number => {
    const field = labelledInput("Dígito " + number, "digit-" + number);
    field.input.type = "text";
    field.input.inputMode = "numeric";
    field.input.maxLength = 1;
    field.input.pattern = "[0-9]";
    row.append(field.label);
    return field.input;
  });
  inputs.forEach((input, index) => {
    input.addEventListener("input", () => {
      input.value = input.value.replace(/[^0-9]/g, "");
      if (input.value) inputs[index + 1]?.focus();
    });
    input.addEventListener("paste", event => {
      const pasted = event.clipboardData?.getData("text").trim();
      if (!/^[0-9]{3}$/.test(pasted || "")) return;
      event.preventDefault();
      inputs.forEach((field, position) => { field.value = pasted[position]; });
      inputs[2].focus();
    });
  });
  return { node: row, value: () => inputs.map(input => input.value).join("") };
}

function answerInput(index) {
  if (index === 1) return dateInput();
  if (index === 2) return codeInput();
  const { label, input } = labelledInput("Tu respuesta", "name");
  input.autocomplete = "off";
  return {
    node: label,
    value: () => input.value.normalize("NFC").trim().replace(/\s+/g, " ").toLocaleLowerCase("es")
  };
}

function showPuzzle(index) {
  const puzzle = copy.puzzles[index];
  const block = section();
  if (puzzle.body) block.append(...puzzle.body.map(paragraph));
  const title = heading(block, "h2", puzzle.title);
  for (const [position, hint] of puzzle.hints.entries()) {
    block.append(element("p", index === 2 ? (position + 1) + ". " + hint : hint, "hint"));
  }
  const form = element("form");
  const answer = answerInput(index);
  const message = status();
  form.append(answer.node, submitButton(index === 2 ? "PROBAR CÓDIGO" : "VERIFICAR"), message);
  form.addEventListener("submit", event => {
    event.preventDefault();
    if (answer.value() !== puzzle.answer) {
      message.textContent = puzzle.failure;
      return;
    }
    form.remove();
    const success = element("p", puzzle.success, "success");
    success.setAttribute("role", "status");
    block.append(success, action("ABRIR CARTA " + (index + 1), () => showLetter(index)));
    block.lastElementChild.focus();
  });
  block.append(form);
  focusSection(title);
}

function showFinal() {
  const title = startScreen("La invitación", 3, "Carta 3 de 3");
  page.append(...copy.final.map(paragraph));
  const block = section();
  heading(block, "h2", "¿Te animas a tener una cita conmigo?");
  if (emailEnabled) block.append(element("p", "Tu respuesta y las tres elecciones se enviarán por correo.", "small"));
  const actions = element("div", "", "actions");
  const yes = action("SÍ, VAMOS", () => confirm("Sí, vamos", block, actions));
  const no = action("NO, GRACIAS", () => confirm("No, gracias", block, actions));
  no.className = "secondary";
  actions.append(yes, no);
  block.append(actions);
  focusSection(title);
}

function saveLocal(response) {
  try {
    localStorage.setItem(storageKey, JSON.stringify(response));
    return true;
  } catch {
    return false;
  }
}

async function sendEmail(response) {
  const result = await fetch("https://formspree.io/f/" + formId, {
    method: "POST",
    headers: { Accept: "application/json" },
    body: new URLSearchParams(response),
    signal: AbortSignal.timeout(12000)
  });
  if (!result.ok) throw new Error("No se pudo enviar la respuesta");
}

async function confirm(decision, block, actions) {
  const response = {
    respuesta: decision,
    color: choices[0],
    lugar: choices[1],
    actividad: choices[2]
  };
  const accepted = decision === "Sí, vamos";
  actions.replaceChildren();
  const message = status();
  block.append(message);
  const saved = saveLocal(response);
  if (emailEnabled) {
    message.textContent = "Enviando tu respuesta…";
    try {
      await sendEmail(response);
      message.classList.add("success");
      message.textContent = "Respuesta enviada.";
    } catch {
      message.textContent = saved ? "Tu respuesta quedó guardada en este dispositivo. El correo sigue pendiente." : "El correo no se pudo enviar. Puedes volver a intentarlo.";
      actions.append(action("REINTENTAR CORREO", () => {
        message.remove();
        block.querySelector(".decision-result")?.remove();
        confirm(decision, block, actions);
      }));
    }
  } else {
    message.textContent = saved ? "Respuesta guardada en este dispositivo. El correo aún no está configurado." : "El correo aún no está configurado y no se pudo guardar la respuesta en este dispositivo.";
  }

  if (!accepted) {
    block.append(element("p", copy.no, "decision-result"));
    return;
  }
  if (!whatsappEnabled) {
    block.append(element("p", "El contacto de WhatsApp aún no está configurado.", "small decision-result"));
    return;
  }
  const link = element("a", "ABRIR WHATSAPP", "action");
  link.href = "https://wa.me/" + phone + "?text=" + encodeURIComponent(copy.whatsapp);
  actions.append(link);
  if (!emailEnabled || message.classList.contains("success")) location.assign(link.href);
}

function decode(value) {
  return Uint8Array.from(atob(value.replace(/-/g, "+").replace(/_/g, "/")), letter => letter.charCodeAt(0));
}

async function openInvitation() {
  const keyValue = parameters.get("k") || "";
  if (!/^[A-Za-z0-9_-]{43}$/.test(keyValue)) return;
  try {
    const payload = decode(encrypted);
    const key = await crypto.subtle.importKey("raw", decode(keyValue), "AES-GCM", false, ["decrypt"]);
    const clear = await crypto.subtle.decrypt({ name: "AES-GCM", iv: payload.slice(0, 12) }, key, payload.slice(12));
    copy = JSON.parse(new TextDecoder().decode(clear));
    showIntro();
  } catch {
    document.querySelector("#entry-status").textContent = "El enlace no pudo abrir la invitación. Comprueba que lo copiaste completo y ábrelo en una página HTTPS.";
  }
}
openInvitation();
</script>
